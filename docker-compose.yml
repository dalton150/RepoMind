version: "3.9"

services:

  mongodb:
    image: mongo:7

    container_name: ai-agent-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  chromadb:
    image: chromadb/chroma

    container_name: ai-agent-chromadb

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mongodb_data:
  chroma_data: